<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous"> <title>Inventory Directory</title>
</head>
<body>
<div class="container">

    <h4>Inventory Management System</h4>
    <hr>
    <!--create a button to add new faculty-->
    <a th:href="@{/Inventory/viewAddForm}" class="btn btn-dark btn-sm mb-2"> Add New Inventory Item</a>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="theInventory : ${inventoryItems}">
            <td th:text="${theInventory.id}"></td>
            <td th:text="${theInventory.name}"></td>
            <td th:text="${theInventory.category}"></td>
            <td th:text="${theInventory.quantity}"></td>
            <td> <span th:text="${theInventory.status}"
                th:classappend="${theInventory.status == 'In Stock'} ? 'badge badge-success':
                                (${theInventory.status == 'Low Stock'} ? 'badge badge-warning':
                                (${theInventory.status == 'Out of Stock'} ? 'badge badge-danger':
             'badge badge-secondary'))">
                </span>
            </td>
            <td>
                <a th:href="@{/Inventory/viewUpdateForm(inventoryItemId=${theInventory.id})}"
                   class="btn btn-primary btn-sm">Update
                </a>
                <a th:href="@{/Inventory/delete(theInventoryItemId=${theInventory.id})}"
                   class="btn btn-danger btn-sm" onclick="if(!(confirm('To confirm deletion, please click ok; otherwise click cancel'))) return false">Delete
                </a>

            </td>
        </tr>
        </tbody>
    </table>



</div>







</body>
</html>
