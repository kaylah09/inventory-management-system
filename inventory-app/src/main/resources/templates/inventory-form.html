<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous"><title>Faculty Registration</title>
</head>
<body>
    <div class="container">
        <h4>Add New Inventory Item</h4>
        <a class="btn btn-danger" data-toggle="collapse" th:href="@{/Inventory/list}" role="button" aria-expanded="false" aria-controls="collapseExample">
            List of Inventory</a>

        <p class="h6 mb-4">Enter Details For New Inventory Item</p>
        <form th:action="@{/Inventory/save}" th:object="${inventoryItem}" method="POST">

            <input type="hidden" th:field="*{id}"/>

            <input type="text" th:field="*{name}"
                   class="form-control mb-4 col-4" placeholder="Enter Item Name">

            <select th:field="*{category}" class="form-control mb-4 col-4">
                <option value="">Select Category</option>
                <option value="Electronics">Electronics</option>
                <option value="Furniture">Furniture</option>
                <option value="Office Supplies">Office Supplies</option>
                <option value="Other">Other</option>
            </select>

            <input type="number" th:field="*{quantity}" lass="form-control mb-4 col-4"
                placeholder="Enter Quantity"
                min="0"
                max="1000"
                step="1"
                required>


            <select th:field="*{status}" class="form-control mb-4 col-4">
                <option value="">Select Status</option>
                <option value="In Stock">In Stock</option>
                <option value="Low Stock">Low Stock</option>
                <option value="Out of Stock">Out of Stock</option>
            </select>

            <button type="submit" class="btn btn-primary col-2">Save</button>
        </form>
    </div>
</body>
</html>
